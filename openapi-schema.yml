swagger: '2.0'
info:
  title: Software engineering lab
  description: API documentation for the lab
  version: v1
basePath: /api
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Basic:
    type: basic
security:
- Basic: []
paths:
  /logs/:
    get:
      operationId: logs_list
      summary: API endpoint for viewing and managing dose logs.
      description: |-
        A DoseLog represents an event where a medication dose was either
        taken or missed. This viewset provides standard CRUD operations
        and a custom filtering action by date range.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              $ref: '#/definitions/DoseLog'
      tags:
      - logs
    post:
      operationId: logs_create
      summary: API endpoint for viewing and managing dose logs.
      description: |-
        A DoseLog represents an event where a medication dose was either
        taken or missed. This viewset provides standard CRUD operations
        and a custom filtering action by date range.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/DoseLog'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/DoseLog'
      tags:
      - logs
    parameters: []
  /logs/filter/:
    get:
      operationId: logs_filter_by_date
      summary: Retrieve all dose logs within a given date range.
      description: |-
        Query Parameters:
            - start (YYYY-MM-DD): Start date of the range (inclusive).
            - end (YYYY-MM-DD): End date of the range (inclusive).
      parameters: []
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              $ref: '#/definitions/DoseLog'
      tags:
      - logs
    parameters: []
