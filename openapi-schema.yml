  /notes/:
    get:
      operationId: notes_list
      summary: API endpoint for viewing and managing doctor's notes.
      description: |-
        Notes are simple annotations attached to a medication.
        Supported operations:
            - GET /notes/          - list all notes
            - GET /notes/{id}/     - retrieve a single note
            - POST /notes/         - create a new note
            - DELETE /notes/{id}/  - delete a note

        Updating existing notes is intentionally not supported.
      parameters:
      - name: search
        in: query
        description: A search term.
        required: false
        type: string
      responses:
        '200':
          description: ''
          schema:
            type: array
            items:
              $ref: '#/definitions/Note'
      tags:
      - notes
    post:
      operationId: notes_create
      summary: API endpoint for viewing and managing doctor's notes.
      description: |-
        Notes are simple annotations attached to a medication.
        Supported operations:
            - GET /notes/          - list all notes
            - GET /notes/{id}/     - retrieve a single note
            - POST /notes/         - create a new note
            - DELETE /notes/{id}/  - delete a note

        Updating existing notes is intentionally not supported.
      parameters:
      - name: data
        in: body
        required: true
        schema:
          $ref: '#/definitions/Note'
      responses:
        '201':
          description: ''
          schema:
            $ref: '#/definitions/Note'
      tags:
      - notes
    parameters: []
  /notes/{id}/:
    get:
      operationId: notes_read
      summary: API endpoint for viewing and managing doctor's notes.
      description: |-
        Notes are simple annotations attached to a medication.
        Supported operations:
            - GET /notes/          - list all notes
            - GET /notes/{id}/     - retrieve a single note
            - POST /notes/         - create a new note
            - DELETE /notes/{id}/  - delete a note

        Updating existing notes is intentionally not supported.
      parameters: []
      responses:
        '200':
          description: ''
          schema:
