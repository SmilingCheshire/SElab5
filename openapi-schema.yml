      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/DoseLog'
      tags:
      - logs
    delete:
      operationId: logs_delete
      summary: API endpoint for viewing and managing dose logs.
      description: |-
        A DoseLog represents an event where a medication dose was either
        taken or missed. This viewset provides standard CRUD operations
        and a custom filtering action by date range.
      parameters: []
      responses:
        '204':
          description: ''
      tags:
      - logs
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this dose log.
      required: true
      type: integer
  /medications/:
