      tags:
      - notes
    delete:
      operationId: notes_delete
      summary: API endpoint for viewing and managing doctor's notes.
      description: |-
        Notes are simple annotations attached to a medication.
        Supported operations:
            - GET /notes/          - list all notes
            - GET /notes/{id}/     - retrieve a single note
            - POST /notes/         - create a new note
            - DELETE /notes/{id}/  - delete a note

        Updating existing notes is intentionally not supported.
      parameters: []
      responses:
        '204':
          description: ''
      tags:
      - notes
    parameters:
    - name: id
      in: path
      description: A unique integer value identifying this Doctor's note.
      required: true
      type: integer
definitions:
  DoseLog:
    required:
    - medication
    - taken_at
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      medication:
        title: Medication
        type: integer
      taken_at:
        title: Taken at
        type: string
        format: date-time
      was_taken:
        title: Was taken
        type: boolean
  Medication:
    required:
    - name
    - dosage_mg
    - prescribed_per_day
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      name:
        title: Name
        type: string
        maxLength: 100
        minLength: 1
      dosage_mg:
        title: Dosage mg
        type: integer
        maximum: 2147483647
        minimum: 0
      prescribed_per_day:
        title: Prescribed per day
        description: Expected number of doses per day
        type: integer
        maximum: 2147483647
        minimum: 0
      adherence:
        title: Adherence
        type: string
        readOnly: true
  Note:
    required:
    - medication
    - text
    type: object
    properties:
      id:
        title: ID
        type: integer
        readOnly: true
      medication:
        title: Medication
        type: integer
      text:
        title: Text
        type: string
        minLength: 1
      created_at:
        title: Created at
        type: string
        format: date
        readOnly: true
